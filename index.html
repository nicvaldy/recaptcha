<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>reCAPTCHA Explicit Render - Localhost</title>
  <!-- Gunakan ?render=explicit&onload=onRecaptchaLoad agar widget di-render manual lewat JS -->
  <script
    src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit"
    async
    defer
  ></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 520px;
      margin: 48px auto;
      padding: 0 16px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    button {
      padding: 6px 12px;
      cursor: pointer;
    }
    pre {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Explicit Render (<code>grecaptcha.render</code>)</h2>
    <p>Contoh konfigurasi widget Google reCAPTCHA di <code>localhost</code>.</p>

    <!-- Target container kosong tempat widget akan di-render -->
    <div id="recaptcha-container"></div>

    <div class="controls">
      <button type="button" id="btn-reset">Reset Widget</button>
      <button type="button" id="btn-token">Cek Token</button>
    </div>

    <h3>Status / Token</h3>
    <pre id="output">Menunggu script reCAPTCHA dimuat...</pre>
  </div>

  <script>
    let widgetId = null;
    const outputEl = document.getElementById("output");

    // Dipanggil otomatis lewat parameter onload=... pada <script>
    function onRecaptchaLoad() {
      outputEl.textContent = "Script siap. Me-render widget...";

      // Ganti sitekey dengan milikmu, atau gunakan test sitekey resmi Google di bawah ini:
      // Test sitekey Google: 6Lc7_ZssAAAAAJlmfpSxDo815GK8C4bT0MGNyv3s
      widgetId = grecaptcha.render("recaptcha-container", {
        sitekey: "6Lc7_ZssAAAAAJlmfpSxDo815GK8C4bT0MGNyv3s",
        theme: "light", // "light" | "dark"
        size: "normal", // "normal" | "compact"
        callback: function (token) {
          console.log("reCAPTCHA Token:", token);
          outputEl.textContent = "Verified!\nToken:\n" + token;
        },
        "expired-callback": function () {
          outputEl.textContent = "Token kedaluwarsa. Silakan verifikasi ulang.";
        },
        "error-callback": function () {
          outputEl.textContent = "Terjadi error koneksi pada reCAPTCHA.";
        },
      });
    }

    document.getElementById("btn-reset").addEventListener("click", function () {
      if (widgetId !== null && window.grecaptcha) {
        grecaptcha.reset(widgetId);
        outputEl.textContent = "Widget di-reset.";
      }
    });

    document.getElementById("btn-token").addEventListener("click", function () {
      if (widgetId !== null && window.grecaptcha) {
        const token = grecaptcha.getResponse(widgetId);
        outputEl.textContent = token
          ? "Token aktif:\n" + token
          : "Belum ada token aktif.";
      }
    });
  </script>
</body>
</html>
