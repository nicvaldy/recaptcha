<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Test Cloudflare Turnstile</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <h3>Tes Turnstile</h3>
  <!-- Production -->
  <div class="cf-turnstile" data-sitekey="0x4AAAAAAFjwUFZXrIajkk-S"></div>
  <p id="token-output"></p>

  <script>
    function onSuccess(token) {
      document.getElementById("token-output").textContent = "Token: " + token;
      console.log("Turnstile token:", token);
    }
  </script>
</body>
</html>
